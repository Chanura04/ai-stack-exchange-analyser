name: Push Airflow Image to ECR
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Creds
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=0.0.1
          IMAGE_NAME=my-dags
          # Make sure the secret contains full registry URL, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com
          FULL_IMAGE_NAME=${{ secrets.ECR_REGISTRY }}/$IMAGE_NAME:$IMAGE_TAG
          
          echo "Building image $FULL_IMAGE_NAME"
          docker build --pull -t $FULL_IMAGE_NAME -f cicd/Dockerfile .
          
          echo "Pushing image $FULL_IMAGE_NAME"
          docker push $FULL_IMAGE_NAME


          
 
 